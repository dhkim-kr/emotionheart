meld:

  # --- Run / paths ---
  seed: 42
  device: "cuda:0"
  data_dir_path: "data"
  save_model_checkpoint: "model_checkpoints/meld_specific"
  save_analysis_path: "save/analysis/meld_specific"

  # --- Data ---
  n_train_dialogues: 1039
  modalities: "atv" # ["a", "t", "v", "at", "tv", "av", "atv"]
  num_classes: 7

  # --- Experiment mode ---
  # Missing-modality experiment: set True and pass --modalities a|t|v to
  # fine-tune the atv checkpoint for unimodal inference (paper Table 3).
  unimodal_inference: False
  hybrid: False

  # --- Optimization ---
  epochs: 200
  batch_size: 64
  scheduler: "cosineLR_linearWarmUp" # [None, stepLR, multistepLR, reduceLR, cyclicLR, cosineLR, cosineLR_linearWarmUp]
  T: 5 # scheduler warm-up duration (epochs)
  learning_rate: 0.0001
  weight_decay: 0.00001
  max_grad_value: -1.0

  # --- Training objectives ---
  # do_CLIP is the cross-modal graph contrastive learning (GCL) objective of
  # the paper; NACL / DGI are optional auxiliary objectives kept for ablation.
  do_CE: True
  do_WCE: False
  do_CLIP: True
  do_NACL: False
  do_DGI: False
  CLIP_lambda: 0.3
  NACL_lambda: 0.1
  DGI_lambda: 0.01
  topk: 3
  temperature: 0.1

  # --- Heterogeneous graph ---
  centrality: "degree"
  edge_type: multi_hop # single_hop, multi_hop
  max_dist: 22
  num_edge_dis: 22
  multi_hop_max_dist: 22

  # --- Graphormer encoder ---
  encoder_layers: 4
  encoder_attention_heads: 6
  encoder_embed_dim: 384
  ffn_embed_scaler: 4 # ffn dim = encoder_embed_dim * 4
  dropout: 0.3
  attention_dropout: 0.
  act_dropout: 0.0
  activation_fn: "gelu"
  encoder_normalize_before: True
  pre_layernorm: True
  apply_graphormer_init: False
